<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Joakim Næss Lea</title>
    <link rel="preload" href="assets/fonts/slkscr.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="assets/joakim.css" />
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#FE5100" />
    <meta name="description" content="Jeg har internett og min epostadresse er hei@joak.im" />
  </head>

  <body>
    <main>
      <h1>Hei og vel&shy;kommen!</h1>

      <p id="intro">
        Jeg heter <strong>Joakim Næss Lea</strong> og digger design, teknologi og the World Wide
        Web.
      </p>
      <p>Dette er hjemmesiden min, min digitale hage. Her kan alt skje! Eller ingenting, som nå.</p>
      <p id="kontakt"">
        Tast <a href="tel:+4747311422">47 31 14 22</a> eller
        <a href="mailto:hei@joak.im">hei@joak.im</a>, hvis du vil chatte.
      </p>
      <picture>
        <img
            srcset="
                /assets/joakim-200px.webp,
                /assets/joakim-400px.webp 2x
            "
            src="/assets/joakim-400px.webp.jpeg"
            height="50"
            width="50"
            alt="Et portrett av Joakim Næss Lea. En flott herremann med skjegg, i følge ham selv."
            draggable="false"
        />
        <audio src="assets/scratch.mp3" preload="auto" />
    </picture>
    </main>
    <svg xmlns="http://www.w3.org/2000/svg" height="0" width="0">
      <filter id="pixelate" x="0" y="0">
        <feFlood x="4" y="4" height="1" width="1" />
        <feComposite width="4" height="4" />
        <feTile result="tiles" />
        <feComposite in="SourceGraphic" operator="in" />
        <feMorphology operator="dilate" radius="1.5" />
        <feMorphology operator="erode" radius="1" />
      </filter>
    </svg>
    <script>
    const audio = document.querySelector("audio");
    const avatar = document.querySelector("picture");
    avatar.addEventListener("mousedown", (event) => {
      audio.pause();
      audio.currentTime = 0;
      audio.play();
    });
    </script>
  </body>
</html>
