<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Joakim Næss Lea</title>
    <link rel="preload" href="assets/fonts/slkscr.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="assets/joakim.css" />
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#FE5100" />
    <meta name="description" content="Jeg har internett og min epostadresse er hei@joak.im" />
  </head>

  <body>
    <main>
      <h1>Hei!</h1>

      <p id="intro">
        Jeg heter Joakim og digger design, teknologi og the World Wide Web.
      </p>
      <p>Dette er min hjemmeside, min digitale hage. Her kan alt skje. Eller ingenting, som nå.</p>
      <p id="kontakt"">
        Tast <a href="tel:+4747311422">47 31 14 22</a> eller
        <a href="mailto:hei@joak.im">hei@joak.im</a>, hvis du vil chatte.
      </p>
      <picture>
        <img
            srcset="
                /assets/joakim-200px.webp,
                /assets/joakim-400px.webp 2x
            "
            src="/assets/joakim-400px.webp.jpeg"
            height="50"
            width="50"
            alt="Profilbilde av Joakim. Smilende 40 år gammel mann med mørkt hår og skjegg."
            draggable="false"
        />
        <audio src="assets/scratch.mp3" preload="auto" />
    </picture>
    </main>
    <div id="particles-js"></div>
    <script src="assets/particles.min.js"></script>
    <script>
    /* particlesJS.load(@dom-id, @path-json, @callback (optional)); */
    particlesJS.load('particles-js', 'assets/particles.json', function() {
      console.log('callback - particles.js config loaded');
    });
    const audio = document.querySelector("audio");
    const avatar = document.querySelector("picture");
    avatar.addEventListener("mousedown", (event) => {
      audio.pause();
      audio.currentTime = 0;
      audio.play();
    });
    </script>
  </body>
</html>
